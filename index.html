
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرسمنا 🎨</title>

<meta property="og:title" content="مرسمنا ">
<meta property="og:description" content="ضيف لمستك 💗">
<meta property="og:image" content="foto.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="مرسمنا"> 
<style>
:root {
  --burgundy: #8E2630;
  --burgundy-dark: #6F1C25;
  --cream: #FFF9F0;
  --pink: #F3DCE3;
  --text: #422E2E;
  --muted: #8A7474;
  --white: #FFFFFF;
  --border: #E9D8D5;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.top-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 22px 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}

.logo-mark {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
}

.logo-mark svg {
  display: block;
  width: 100%;
  height: 100%;
}

.top-header h1 {
  margin: 0;
  color: var(--burgundy);
  font-size: 29px;
}

.top-header p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.main-container {
  width: min(1100px, calc(100% - 32px));
  margin: 26px auto;
}

.drawing-panel,
.gallery-section {
  padding: 24px;
  margin-bottom: 24px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(95, 45, 45, 0.05);
}

.section-heading {
  margin-bottom: 20px;
}

.section-heading h2 {
  margin: 0;
  color: var(--burgundy);
  font-size: 23px;
}

.section-heading p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.field-label,
.tool-label {
  display: block;
  color: var(--text);
  font-size: 13px;
  font-weight: bold;
}

.name-input {
  display: block;
  width: 100%;
  max-width: 420px;
  min-height: 44px;
  margin-top: 8px;
  padding: 10px 13px;
  color: var(--text);
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
}

.name-input:focus {
  border-color: var(--burgundy);
  box-shadow: 0 0 0 3px rgba(142, 38, 48, 0.1);
}

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 20px 0 14px;
}

.tool-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

#brushColor {
  width: 42px;
  height: 38px;
  padding: 3px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 9px;
  cursor: pointer;
}

.size-group input {
  width: 100px;
  accent-color: var(--burgundy);
  cursor: pointer;
}

#sizeValue {
  min-width: 20px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  padding: 9px;
  color: var(--burgundy);
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.icon-btn svg {
  width: 100%;
  height: 100%;
}

.icon-btn:hover:not(:disabled),
.icon-btn.selected {
  color: var(--white);
  background: var(--burgundy);
  border-color: var(--burgundy);
}

.icon-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.clear-btn {
  margin-inline-start: auto;
}

.canvas-frame {
  width: 100%;
  overflow: hidden;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 12px;
  line-height: 0;
}

#drawingCanvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1000 / 650;
  background: var(--white);
  touch-action: none;
  cursor: crosshair;
}

.drawing-hint {
  margin: 10px 0 16px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.drawing-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.primary-btn,
.secondary-btn {
  min-height: 44px;
  padding: 11px 18px;
  border: 1px solid var(--burgundy);
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s;
}

.primary-btn {
  color: var(--white);
  background: var(--burgundy);
}

.primary-btn:hover {
  background: var(--burgundy-dark);
}

.secondary-btn {
  color: var(--burgundy);
  background: var(--white);
}

.secondary-btn:hover {
  background: var(--pink);
}

.status-message {
  min-height: 20px;
  margin: 12px 0 0;
  color: var(--burgundy);
  font-size: 13px;
  line-height: 1.6;
}

/* أزرار صفحتي المعرض */
.gallery-heading {
  margin-bottom: 18px;
}

.gallery-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding-bottom: 14px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.tab-btn {
  min-height: 42px;
  padding: 10px 16px;
  color: var(--burgundy);
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
}

.tab-btn.active {
  color: var(--white);
  background: var(--burgundy);
  border-color: var(--burgundy);
}

/* الصفحة الأولى: صور متلاصقة بلا أسماء ولا فواصل */



.collage-gallery {
  display: grid;
  grid-template-columns: repeat(
    var(--collage-columns, 1),
    var(--tile-size, 100px)
  );
  align-content: start;
  justify-content: start;
  gap: 4px;

  width: 100%;
  height: 320px;
  padding: 8px;
  box-sizing: border-box;
  overflow: hidden;

  background: #FFFFFF;
  border: 3px solid var(--burgundy);
  border-radius: 12px;
}

.collage-image {
  display: block;
  width: var(--tile-size, 100px);
  height: var(--tile-size, 100px);
  min-width: 0;
  object-fit: contain;
  margin: 0;
  padding: 0;
  border: 0;
}





/* الصفحة الثانية: بطاقة مستقلة لكل رسمة */
.members-gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.drawing-card {
  min-width: 0;
  overflow: hidden;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 14px;
}

.drawing-card img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  background: var(--white);
}

.drawing-author {
  margin: 0;
  padding: 12px 8px;
  color: var(--burgundy);
  font-weight: bold;
  font-size: 14px;
  text-align: center;
  overflow-wrap: anywhere;
  border-top: 1px solid var(--border);
}

.empty-message {
  margin: 24px 0;
  padding: 25px 15px;
  color: var(--muted);
  background: var(--cream);
  border: 1px dashed var(--border);
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.8;
  text-align: center;
}

.empty-message[hidden] {
  display: none;
}

.hidden {
  display: none !important;
}

.site-footer {
  padding: 8px 10px 20px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

/* الموبايل */
@media (max-width: 600px) {
  .top-header {
    padding: 17px 12px;
  }

  .logo-mark {
    width: 43px;
    height: 43px;
  }

  .top-header h1 {
    font-size: 25px;
  }

  .main-container {
    width: calc(100% - 18px);
    margin: 14px auto;
  }

  .drawing-panel,
  .gallery-section {
    padding: 14px;
    margin-bottom: 14px;
    border-radius: 15px;
  }

  .section-heading h2 {
    font-size: 20px;
  }

  .toolbar {
    gap: 8px;
  }

  .tool-group {
    gap: 6px;
  }

  .size-group {
    flex: 1;
    min-width: 135px;
  }

  .size-group input {
    flex: 1;
    width: auto;
    min-width: 45px;
  }

  .icon-btn {
    width: 39px;
    height: 39px;
  }

  .clear-btn {
    margin-inline-start: 0;
  }

  .drawing-actions {
    display: grid;
    grid-template-columns: 1fr;
  }

  .primary-btn,
  .secondary-btn {
    width: 100%;
  }

  .gallery-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .tab-btn {
    padding: 9px 7px;
    font-size: 12px;
  }


  .collage-gallery {
    height: 230px;
    gap: 3px;
    padding: 5px;
  }


  .collage-image {
    width: 65px;
    height: 65px;
    flex-basis: 65px;
  }

  .drawing-author {
    padding: 10px 5px;
    font-size: 13px;
  }
}

</style>
</head>
<body>

  <header class="top-header">
    <div class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 5C13 5 5 13 5 23c0 10 8 18 18 18h4c4 0 6-3 4-6-1-2-1-4 2-5 6-1 10-7 10-13C43 10 35 5 24 5Z"
          fill="#EBC4D2" stroke="#8E2630" stroke-width="2"/>
        <circle cx="17" cy="17" r="3" fill="#8E2630"/>
        <circle cx="27" cy="13" r="3" fill="#8E2630"/>
        <circle cx="35" cy="21" r="3" fill="#8E2630"/>
        <circle cx="17" cy="27" r="3" fill="#8E2630"/>

    </div>
    <div>
      <h1>مرسمنا</h1>

  <main class="main-container">

    <section class="drawing-panel">
      <div class="section-heading">
  
      </div>

      <label class="field-label" for="artistName">اسم الرسّام</label>

      <div class="canvas-frame">

    <section class="gallery-section">

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // أضيفي هنا المفتاح العام (Publishable key) من Supabase.
    // لا تضعي service_role أو secret key في ملف HTML.
    const SUPABASE_URL = "https://ikkmmbqnelmcshuohpzu.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_aZMQc_rw_OO7YMAl3AsTnw_n6upyMyz";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const canvas = document.getElementById("drawingCanvas");
    const ctx = canvas.getContext("2d");

    const artistName = document.getElementById("artistName");
    const brushColor = document.getElementById("brushColor");
    const brushSize = document.getElementById("brushSize");
    const sizeValue = document.getElementById("sizeValue");

    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    const eraserBtn = document.getElementById("eraserBtn");
    const clearBtn = document.getElementById("clearBtn");
    const saveBtn = document.getElementById("saveBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusMessage = document.getElementById("statusMessage");

    const collageGallery = document.getElementById("collageGallery");
    const membersGallery = document.getElementById("membersGallery");
    const emptyCollage = document.getElementById("emptyCollage");
    const emptyMembers = document.getElementById("emptyMembers");

    let drawing = false;
    let erasing = false;
    let history = [];
    let redoHistory = [];
    let drawings = [];

    const MAX_HISTORY = 50;

    // خلفية بيضاء للورقة
    function paintWhiteBackground() {
      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    function updateHistoryButtons() {
      undoBtn.disabled = history.length <= 1;
      redoBtn.disabled = redoHistory.length === 0;
    }

    function saveHistory() {
      history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));

      if (history.length > MAX_HISTORY) {
        history.shift();
      }

      redoHistory = [];
      updateHistoryButtons();
    }

    function restoreState(imageData) {
      if (!imageData) return;
      ctx.putImageData(imageData, 0, 0);
      updateHistoryButtons();
    }

    function undo() {
      if (history.length <= 1) return;

      redoHistory.push(history.pop());
      restoreState(history[history.length - 1]);
    }

    function redo() {
      if (redoHistory.length === 0) return;

      const nextState = redoHistory.pop();
      history.push(nextState);

      if (history.length > MAX_HISTORY) {
        history.shift();
      }

      restoreState(nextState);
    }

    function getCanvasPosition(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startDrawing(event) {
      if (event.button !== undefined && event.button !== 0) return;

      event.preventDefault();
      drawing = true;

      canvas.setPointerCapture(event.pointerId);

      const point = getCanvasPosition(event);

      ctx.beginPath();
      ctx.moveTo(point.x, point.y);

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = Number(brushSize.value);

      if (erasing) {
        ctx.globalCompositeOperation = "destination-out";
        ctx.strokeStyle = "rgba(0,0,0,1)";
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = brushColor.value;
      }

      // حتى النقطة الواحدة تظهر حتى لو ما تحرك المؤشر
      ctx.lineTo(point.x + 0.01, point.y + 0.01);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(point.x, point.y);
    }

    function draw(event) {
      if (!drawing) return;

      event.preventDefault();

      const point = getCanvasPosition(event);

      ctx.lineWidth = Number(brushSize.value);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (erasing) {
        ctx.globalCompositeOperation = "destination-out";
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = brushColor.value;
      }

      ctx.lineTo(point.x, point.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (!drawing) return;

      drawing = false;
      ctx.closePath();
      ctx.globalCompositeOperation = "source-over";
      saveHistory();
    }

    canvas.addEventListener("pointerdown", startDrawing);
    canvas.addEventListener("pointermove", draw);
    canvas.addEventListener("pointerup", stopDrawing);
    canvas.addEventListener("pointercancel", stopDrawing);
    canvas.addEventListener("lostpointercapture", stopDrawing);

    brushSize.addEventListener("input", () => {
      sizeValue.textContent = brushSize.value;
    });

    undoBtn.addEventListener("click", undo);
    redoBtn.addEventListener("click", redo);

    eraserBtn.addEventListener("click", () => {
      erasing = !erasing;
      eraserBtn.classList.toggle("selected", erasing);
      eraserBtn.setAttribute("aria-pressed", String(erasing));
    });

    clearBtn.addEventListener("click", () => {
      paintWhiteBackground();
      saveHistory();
      statusMessage.textContent = " ";
    });

    // تحويل الرسمة إلى ملف PNG قابل للتنزيل
    function downloadDrawing() {
      const link = document.createElement("a");
      link.download = "marsamna-drawing.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    downloadBtn.addEventListener("click", downloadDrawing);

    // رفع الرسمة إلى Storage ثم حفظ بياناتها في الجدول.
    async function addDrawingToGallery() {
      const name = artistName.value.trim();

      if (!name) {
        statusMessage.textContent = "اكتب اسمك أولاً حتى نعرف صاحب الرسمة.";
        artistName.focus();
        return;
      }

      if (SUPABASE_PUBLISHABLE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE") {
        statusMessage.textContent = "باقي إعداد المفتاح العام لـ Supabase داخل الكود.";
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "جاري حفظ الرسمة...";

      try {
        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob((result) => result ? resolve(result) : reject(new Error("تعذر تجهيز الصورة.")), "image/png");
        });
        const filePath = `${crypto.randomUUID()}.png`;

        const { error: uploadError } = await supabaseClient.storage
          .from("Artwork")
          .upload(filePath, blob, { contentType: "image/png", upsert: false });
        if (uploadError) throw uploadError;

        const { error: insertError } = await supabaseClient
          .from("Artwork")
          .insert({ artist_name: name, image_url: filePath });

        if (insertError) {
          await supabaseClient.storage.from("Artwork").remove([filePath]);
          throw insertError;
        }

        artistName.value = "";
        await loadDrawings();
        statusMessage.textContent = "انحفظت رسمتك بالمعرض بنجاح!";
      } catch (error) {
        console.error("Supabase save error:", error);
        statusMessage.textContent = "ما كدرت أحفظ الرسمة. تأكد من إعدادات Supabase والسياسات.";
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "حفظ الرسمة بالمعرض";
      }
    }

    saveBtn.addEventListener("click", addDrawingToGallery);

  
function fitCollageGallery() {
  const count = drawings.length;

  if (count === 0) return;

  const style = getComputedStyle(collageGallery);

  const paddingX =
    parseFloat(style.paddingLeft) +
    parseFloat(style.paddingRight);

  const paddingY =
    parseFloat(style.paddingTop) +
    parseFloat(style.paddingBottom);

  const gap = parseFloat(style.columnGap) || 0;

  const availableWidth = collageGallery.clientWidth - paddingX;
  const availableHeight = collageGallery.clientHeight - paddingY;

  const baseSize = window.matchMedia("(max-width: 600px)").matches
    ? 65
    : 100;

  let bestSize = 0;
  let bestColumns = 1;

  for (let columns = 1; columns <= count; columns++) {
    const rows = Math.ceil(count / columns);

    const cellWidth =
      (availableWidth - gap * (columns - 1)) / columns;

    const cellHeight =
      (availableHeight - gap * (rows - 1)) / rows;

    const size = Math.min(baseSize, cellWidth, cellHeight);

    if (
      size > bestSize + 0.01 ||
      (Math.abs(size - bestSize) <= 0.01 && columns > bestColumns)
    ) {
      bestSize = size;
      bestColumns = columns;
    }
  }

  collageGallery.style.setProperty(
    "--collage-columns",
    bestColumns
  );

  collageGallery.style.setProperty(
    "--tile-size",
    Math.max(1, bestSize) + "px"
  );
}

function renderGallery() {
  collageGallery.replaceChildren();
  membersGallery.replaceChildren();

  emptyCollage.hidden = drawings.length > 0;
  emptyMembers.hidden = drawings.length > 0;

  drawings.forEach((drawing) => {
    // اللوحة الجماعية: صور فقط
    const collageImage = document.createElement("img");
    collageImage.src = drawing.image;
    collageImage.alt = "رسمة من مرسمنا";
    collageImage.className = "collage-image";
    collageGallery.appendChild(collageImage);

    // صفحة الأعضاء: رسمة واسم صاحبها
    const card = document.createElement("article");
    card.className = "drawing-card";

    const cardImage = document.createElement("img");
    cardImage.src = drawing.image;
    cardImage.alt = "رسمة " + drawing.name;

    const nameLabel = document.createElement("p");
    nameLabel.className = "drawing-author";
    nameLabel.textContent = drawing.name;

    card.appendChild(cardImage);
    card.appendChild(nameLabel);
    membersGallery.appendChild(card);
  });

  fitCollageGallery();
}


// جلب الرسومات من الجدول وإنشاء روابط مؤقتة للصور في الـ bucket الخاص.
async function loadDrawings() {
  try {
    const { data, error } = await supabaseClient
      .from("Artwork")
      .select("id, created_at, artist_name, image_url")
      .order("created_at", { ascending: false });
    if (error) throw error;

    const prepared = await Promise.all((data || []).map(async (row) => {
      const { data: signedData, error: signedError } = await supabaseClient.storage
        .from("Artwork")
        .createSignedUrl(row.image_url, 3600);
      if (signedError) {
        console.error("Image URL error:", signedError);
        return null;
      }
      return {
        id: row.id,
        name: row.artist_name,
        image: signedData.signedUrl,
        storagePath: row.image_url
      };
    }));

    drawings = prepared.filter(Boolean);
    renderGallery();
  } catch (error) {
    console.error("Supabase load error:", error);
    statusMessage.textContent = "ما كدرت أحمّل الرسومات. تأكدي من اسم الجدول والسياسات.";
  }
}

window.addEventListener("resize", fitCollageGallery);


    // التنقل بين صفحتي المعرض
    const tabButtons = document.querySelectorAll(".tab-btn");
    const galleryPages = document.querySelectorAll(".gallery-page");

    tabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const targetPage = button.dataset.page;

        tabButtons.forEach((tab) => {
          const selected = tab === button;
          tab.classList.toggle("active", selected);
          tab.setAttribute("aria-selected", String(selected));
        });

        galleryPages.forEach((page) => {
          page.classList.toggle("hidden", page.id !== targetPage);
        });
      });
    });

    // بدء البرنامج بورقة بيضاء
    paintWhiteBackground();
    saveHistory();
    loadDrawings();
  </script>
